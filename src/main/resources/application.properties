spring.application.name=svc-canomar
server.port=8080

# ---- Base de datos MySQL 8 ----
# La base se crea sola la primera vez (createDatabaseIfNotExist).
# Cambie la contraseña por la de su usuario root de MySQL, o use la variable de entorno DB_PASSWORD.
spring.datasource.url=jdbc:mysql://localhost:3306/svc_canomar?createDatabaseIfNotExist=true&serverTimezone=America/Lima&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# Crea las tablas (schema.sql) y carga los datos de demostración (data.sql) en cada arranque, sin duplicar.
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

# ---- Vistas ----
spring.thymeleaf.cache=false
spring.mvc.format.date=yyyy-MM-dd

# ---- Sesión y seguridad ----
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.error.include-stacktrace=never

# ---- Archivos subidos / descargas ----
spring.servlet.multipart.max-file-size=5MB

# Tipo de archivo del manifiesto de la PWA
server.mime-mappings.webmanifest=application/manifest+json

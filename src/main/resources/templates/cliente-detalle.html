<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/base :: head('Cliente')}"></head>
<body>
<header th:replace="~{fragments/base :: barra(${cliente.nombreComercial()}, '/clientes')}"></header>
<main class="contenido">
    <div th:replace="~{fragments/base :: mensajes}"></div>
    <div class="kpis">
        <div class="kpi"><small>Saldo</small><b class="rojo" th:text="${@fmt.soles(saldo.saldo())}"></b></div>
        <div class="kpi"><small>Disponible</small><b th:text="${@fmt.soles(saldo.disponible())}"></b></div>
        <div class="kpi"><small>Vencido</small><b th:classappend="${saldo.conVencido()} ? 'rojo'" th:text="${@fmt.soles(saldo.vencido())}"></b></div>
    </div>
    <p class="ayuda" th:text="'RUC ' + (${cliente.ruc()} ?: '—') + ' · límite ' + ${@fmt.soles(cliente.limiteCredito())} + ' · plazo ' + ${cliente.plazoDias()} + ' días'"></p>
    <h2>Ventas al crédito con saldo</h2>
    <div class="tabla"><table>
        <tr><th>Venta</th><th>Fecha</th><th class="num">Total</th><th class="num">Pagado</th><th class="num">Debe</th></tr>
        <tr th:each="p : ${pendientes}" th:if="${p.pendiente().signum() > 0}">
            <td><a th:href="@{/ventas/{id}(id=${p.idVenta()})}" th:text="${#numbers.formatInteger(p.idVenta(), 4)}"></a></td>
            <td th:text="${@fmt.fechaHora(p.fechaHora())}"></td>
            <td class="num" th:text="${@fmt.numero(p.total())}"></td>
            <td class="num" th:text="${@fmt.numero(p.pagado())}"></td>
            <td class="num rojo" th:text="${@fmt.numero(p.pendiente())}"></td>
        </tr>
    </table></div>
    <a sec:authorize="hasRole('ADMINISTRADOR')" class="btn" th:href="@{/cobranza/{id}(id=${cliente.id()})}">Ir a cobranza</a>
    <p th:replace="~{fragments/base :: pie('P06 Cliente · RF09 RF32')}"></p>
</main>
<nav th:replace="~{fragments/base :: nav('mas')}"></nav>
<script th:replace="~{fragments/base :: scripts}"></script>
</body>
</html>

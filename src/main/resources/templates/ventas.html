<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head('Ventas del día')}"></head>
<body>
<header th:replace="~{fragments/base :: barra('Ventas del día', '/vender')}"></header>
<main class="contenido">
    <div th:replace="~{fragments/base :: mensajes}"></div>
    <form th:action="@{/ventas}" method="get" class="fila">
        <input type="date" name="fecha" th:value="${fecha}">
        <button class="btn btn-sec" style="margin-top:0" type="submit">Consultar</button>
    </form>
    <div class="kpis" style="margin-top:10px">
        <div class="kpi"><small>Ventas</small><b th:text="${cantidad}">0</b></div>
        <div class="kpi"><small>Total</small><b th:text="${@fmt.soles(total)}">S/ 0</b></div>
    </div>
    <div class="chips" style="margin-bottom:10px">
        <button type="button" th:each="e : ${porTipo}" th:text="${e.key} + ' ' + ${@fmt.soles(e.value)}"></button>
    </div>
    <div id="pendientes-locales"></div>
    <a class="item" th:each="v : ${ventas}" th:href="@{/ventas/{id}(id=${v.id()})}" th:classappend="${v.anulada()} ? 'tachado'">
        <div>
            <div class="t1" th:text="${v.numero()} + ' · ' + ${@fmt.hora(v.fechaHora())}"></div>
            <div class="t2" th:text="${v.cliente()} + ' · ' + (${v.tipoPago() == 'CREDITO'} ? 'Crédito' : ${@fmt.medio(v.medioPago())}) + (${v.esRemate()} ? ' · remate' : '') + (${v.anulada()} ? ' · anulada: ' + ${v.motivoAnulacion()} : '') + (${v.sincronizada()} ? ' · enviada sin conexión' : '')"></div>
        </div>
        <span class="v" th:classappend="${v.anulada()} ? 'rojo'" th:text="${@fmt.soles(v.total())}"></span>
    </a>
    <p class="ayuda" th:if="${ventas.isEmpty()}">No hay ventas en esta fecha.</p>
    <p th:replace="~{fragments/base :: pie('P11 Ventas del día · RF23')}"></p>
</main>
<nav th:replace="~{fragments/base :: nav('vender')}"></nav>
<script th:replace="~{fragments/base :: scripts}"></script>
</body>
</html>

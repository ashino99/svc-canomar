<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/base :: head('Nueva compra')}"></head>
<body>
<header th:replace="~{fragments/base :: barra('Nueva compra', '/inicio')}"></header>
<main class="contenido">
    <div th:replace="~{fragments/base :: mensajes}"></div>
    <form th:action="@{/compras}" method="post" id="form-compra">
        <label>Proveedor</label>
        <select name="idProveedor" required>
            <option th:each="p : ${proveedores}" th:value="${p.id()}" th:text="${p.nombre()}"></option>
        </select>
        <a sec:authorize="hasRole('ADMINISTRADOR')" th:href="@{/proveedores}" class="ayuda" style="display:inline-block">Proveedores y deudas ›</a>

        <h2>Productos comprados (RF11)</h2>
        <div id="lineas-compra"></div>
        <template id="tpl-compra">
            <div class="linea-venta">
                <select name="idProducto" aria-label="Producto">
                    <option th:each="p : ${productos}" th:value="${p.id()}" th:text="${p.nombre()}"></option>
                </select>
                <input name="kilos" type="number" step="0.01" min="0.01" inputmode="decimal" placeholder="kg" required>
                <input name="costo" type="number" step="0.01" min="0.01" inputmode="decimal" placeholder="S/ total" required>
                <button type="button" class="quitar" aria-label="Quitar">×</button>
            </div>
        </template>
        <button type="button" class="btn btn-sec" id="agregar-compra">+ Agregar producto</button>

        <div class="segmento">
            <input type="radio" name="tipoPago" id="tp-contado" value="CONTADO"><label for="tp-contado">Contado</label>
            <input type="radio" name="tipoPago" id="tp-credito" value="CREDITO"><label for="tp-credito">A crédito</label>
        </div>
        <div class="total"><span>Total</span><span id="total-compra">0.00 kg · S/ 0.00</span></div>
        <button class="btn" type="submit">Registrar compra</button>
        <p class="ayuda">Al guardar, los kilos se suman al saldo con la fecha de hoy y se recalcula el costo promedio por kilo (RF12).</p>
    </form>

    <h2>Compras de hoy</h2>
    <div class="item" th:each="c : ${comprasHoy}"><div><div class="t1" th:text="${c.proveedor()}"></div><div class="t2" th:text="${@fmt.kg(c.kilos())} + ' · ' + ${c.tipoPago()}"></div></div>
        <span class="v" th:text="${@fmt.soles(c.total())}"></span></div>
    <p class="ayuda" th:if="${comprasHoy.isEmpty()}">Aún no hay compras hoy.</p>
    <p th:replace="~{fragments/base :: pie('P08 Nueva compra · RF11 RF12')}"></p>
</main>
<nav th:replace="~{fragments/base :: nav('mas')}"></nav>
<script th:replace="~{fragments/base :: scripts}"></script>
</body>
</html>

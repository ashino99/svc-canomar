# Compila el proyecto y ejecuta las pruebas JUnit en cada push (GitHub Actions)
name: Compilar y probar

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar y ejecutar pruebas
        run: mvn -B verify
